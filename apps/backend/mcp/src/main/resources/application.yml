spring:
  config:
    import:
      - "optional:file:.env[.properties]"

  profiles:
    active: local

  application:
    name: schemafy-mcp

  data:
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    mcp:
      server:
        name: schemafy-mcp
        version: 0.0.1
        instructions: >
          Schemafy MCP exposes authenticated read access to Schemafy workspaces,
          projects, schemas, ERD tables, columns, indexes, constraints,
          relationships, memos, and database vendors. It also exposes narrowly
          scoped write tools for workspace/project management, ERD structural
          changes, invitations, memberships, share links, and memos. A write
          tool requires its corresponding MCP scope, confirmed=true for state
          changing high-risk tools, and the same domain access rules as the API.
          Share-link codes and URLs are returned only when a link is created.
          If an ID is unknown,
          start with schemafy_list_workspaces, then schemafy_list_projects,
          schemafy_list_schemas, schemafy_list_tables, and table-detail tools.
        protocol: STREAMABLE
        type: ASYNC
        annotation-scanner:
          enabled: true

  r2dbc:
    url: r2dbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:schemafy}
    username: ${DB_USER:schemafy}
    password: ${DB_PASSWORD:schemafy}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

  output:
    ansi:
      enabled: always

  sql:
    init:
      mode: always
      schema-locations: classpath:ddl/mariadb/**/*.sql

collaboration:
  presence:
    session-ttl: ${COLLABORATION_PRESENCE_SESSION_TTL:90s}
  erd-state-snapshot:
    debounce: ${ERD_STATE_SNAPSHOT_DEBOUNCE:100ms}
    max-wait: ${ERD_STATE_SNAPSHOT_MAX_WAIT:500ms}
    retry-backoff: ${ERD_STATE_SNAPSHOT_RETRY_BACKOFF:100ms}
    max-retry-backoff: ${ERD_STATE_SNAPSHOT_MAX_RETRY_BACKOFF:400ms}
    completed-watermark-ttl: ${ERD_STATE_SNAPSHOT_COMPLETED_WATERMARK_TTL:4h}

server:
  port: ${MCP_SERVER_PORT:8081}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  api-version: ${APP_API_VERSION:v1}

mcp:
  security:
    token:
      secret: ${MCP_TOKEN_SECRET:schemafy-mcp-local-secret-minimum-256-bit-key-value}
      issuer: ${MCP_TOKEN_ISSUER:schemafy-mcp}
      audience: ${MCP_TOKEN_AUDIENCE:schemafy-mcp}
      token-type: ${MCP_TOKEN_TYPE:MCP}
      required-scope: ${MCP_TOKEN_REQUIRED_SCOPE:mcp}
      revocation-key-prefix: ${MCP_TOKEN_REVOCATION_KEY_PREFIX:mcp:token:revoked:}
    rate-limit:
      enabled: ${MCP_RATE_LIMIT_ENABLED:true}
      requests: ${MCP_RATE_LIMIT_REQUESTS:120}
      key-prefix: ${MCP_RATE_LIMIT_KEY_PREFIX:mcp:rate-limit:user:}
      window: ${MCP_RATE_LIMIT_WINDOW:1m}

problem:
  type-base-uri: about:blank

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
